  <noscript><div class="nojs">

  <!-- Greeting text and track metadata. Audio loads separately from the page. -->
  <script id="greeting-config" type="application/json">
{
  "recipient": "",
  "sender": "",
  "paragraphs": [
    "认识你，是最近一件挺开心的事。",
    "记得你喜欢好吃的，也喜欢 R&B。\n于是准备了这一点月光、一点节奏，\n还有这几句祝福。",
    "愿你今晚吃到喜欢的，听到喜欢的，\n也过得轻松、开心。",
    "中秋快乐！"
  ],
  "songTitle": "Good Days",
  "songDuration": 281.208163
}
  </script>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    let config = {};
    try { config = JSON.parse($('greeting-config').textContent); } catch (error) { console.warn('使用默认祝福。', error); }
    const text = (value, fallback = '') => typeof value === 'string' && value.trim() ? value.trim() : fallback;
    const recipient = text(config.recipient);
    const sender = text(config.sender);
    if (recipient) {
      $('dedication').textContent = '中秋 · 给' + recipient;
      $('letterTo').textContent = '给' + recipient;
      document.title = '给' + recipient + '的一小份月光';
    }
    const paragraphs = Array.isArray(config.paragraphs) && config.paragraphs.length
      ? config.paragraphs : ['认识你，是最近一件挺开心的事。'];
    paragraphs.forEach(value => {
      const p = document.createElement('p');
      p.textContent = String(value);
      $('letterBody').append(p);
    });
    if (sender) { $('signature').hidden = false; $('signature').textContent = '— ' + sender; }

    // Keep playback in the native audio element; enhance only its controls.
    const songTitle = text(config.songTitle, 'Good Days');
    $('songTitle').textContent = songTitle;
    $('moonTrack').textContent = 'SZA · ' + songTitle;
    const audio = $('localAudio');
    const seek = $('seekMusic');
    const playButtons = [$('playMusic'), $('headerMusicButton')];
    let wantsPlayback = false;
    let requestId = 0;
    let waitingTimer = 0;
    let scrubbing = false;
    const duration = () => Number.isFinite(audio.duration) && audio.duration > 0
      ? audio.duration : Number(config.songDuration) || 0;
    const clockTime = value => {
      const seconds = Math.max(0, Math.floor(value || 0));
      return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
    };
    const spokenTime = value => {
      const seconds = Math.max(0, Math.floor(value || 0));
      return Math.floor(seconds / 60) + ' 分 ' + seconds % 60 + ' 秒';
    };
    function renderProgress(value = audio.currentTime) {
      const total = duration();
      const current = Math.min(Math.max(0, value || 0), total);
      const fraction = total ? current / total : 0;
      $('currentTime').textContent = clockTime(current);
      $('totalTime').textContent = clockTime(total);
      $('playedWidth').setAttribute('width', String(fraction * 338));
      $('seekTrack').style.setProperty('--played', (fraction * 100) + '%');
      seek.max = String(Math.floor(total));
      if (!scrubbing) seek.value = String(Math.floor(current));
      seek.setAttribute('aria-valuetext', spokenTime(current) + '，共 ' + spokenTime(total));
      seek.disabled = !Number.isFinite(audio.duration) || audio.duration <= 0;
    }
    function renderBuffered() {
      const total = duration();
      const ranges = document.createDocumentFragment();
      for (let i = 0; total && i < audio.buffered.length; i++) {
        const start = Math.min(audio.buffered.start(i), total);
        const end = Math.min(audio.buffered.end(i), total);
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', String(start / total * 338));
        rect.setAttribute('width', String(Math.max(0, end - start) / total * 338));
        rect.setAttribute('height', '32');
        ranges.append(rect);
      }
      $('bufferClip').replaceChildren(ranges);
    }
    function setPlayerState(state) {
      clearTimeout(waitingTimer);
      $('musicCard').dataset.state = state;
      document.body.classList.toggle('music-playing', state === 'playing');
      const active = state === 'playing' || state === 'loading';
      const label = state === 'loading' ? '取消播放' : active ? '暂停音乐' : state === 'ended' ? '再听一遍' : '播放音乐';
      playButtons.forEach(button => {
        button.setAttribute('aria-label', label);
        button.setAttribute('aria-pressed', String(active));
      });
      $('headerMusicLabel').textContent = state === 'loading' ? '加载中…' : label;
      $('retryAudio').hidden = state !== 'error';
      const messages = {
        idle: '点一下，让音乐陪你。',
        loading: '音乐正在路上，稍等一下。',
        playing: '边听边看，慢慢来。',
        paused: '音乐暂停了，月光还在。',
        ended: '听完啦。中秋快乐。',
        error: '音乐暂时没连上，再试一次吧。'
      };
      $('audioStatus').textContent = messages[state];
      if (state === 'loading') {
        waitingTimer = setTimeout(() => {
          $('audioStatus').textContent = '加载有点慢，可以再试一次。';
          $('retryAudio').hidden = false;
        }, 12000);
      }
    }
    async function toggleAudio(forcePlay = false) {
      if (wantsPlayback && !forcePlay) {
        requestId++;
        wantsPlayback = false;
        audio.pause();
        setPlayerState('paused');
        return;
      }
      const attempt = ++requestId;
      wantsPlayback = true;
      if (forcePlay || audio.error) audio.load();
      if (audio.ended) audio.currentTime = 0;
      setPlayerState('loading');
      try {
        await audio.play();
      } catch (error) {
        if (attempt !== requestId || error.name === 'AbortError') return;
        wantsPlayback = false;
        setPlayerState(error.name === 'NotAllowedError' ? 'paused' : 'error');
        if (error.name === 'NotAllowedError') $('audioStatus').textContent = '请再点一下播放键。';
      }
    }
    audio.addEventListener('play', () => { wantsPlayback = true; setPlayerState('loading'); });
    audio.addEventListener('playing', () => { wantsPlayback = true; setPlayerState('playing'); });
    audio.addEventListener('pause', () => {
      wantsPlayback = false;
      setPlayerState(audio.error ? 'error' : audio.ended ? 'ended' : 'paused');
    });
    audio.addEventListener('ended', () => { wantsPlayback = false; setPlayerState('ended'); renderProgress(); });
    audio.addEventListener('waiting', () => { if (wantsPlayback && !audio.paused) setPlayerState('loading'); });
    audio.addEventListener('stalled', () => {
      if (wantsPlayback && !audio.paused && audio.readyState < 3) setPlayerState('loading');
    });
    audio.addEventListener('error', () => { wantsPlayback = false; requestId++; setPlayerState('error'); });
    audio.addEventListener('timeupdate', () => { if (!scrubbing) renderProgress(); });
    ['loadedmetadata', 'durationchange', 'emptied'].forEach(event => {
      audio.addEventListener(event, () => { renderProgress(); renderBuffered(); });
    });
    ['progress', 'seeked'].forEach(event => audio.addEventListener(event, renderBuffered));
    playButtons.forEach(button => button.addEventListener('click', () => toggleAudio()));
    $('retryAudio').addEventListener('click', () => toggleAudio(true));
    seek.addEventListener('input', () => { scrubbing = true; renderProgress(Number(seek.value)); });
    function commitSeek() {
      if (!scrubbing) return;
      const target = Number(seek.value);
      scrubbing = false;
      if (!seek.disabled) audio.currentTime = Math.min(target, audio.duration);
      renderProgress();
    }
    seek.addEventListener('change', commitSeek);
    seek.addEventListener('blur', commitSeek);
    seek.addEventListener('pointercancel', () => { scrubbing = false; renderProgress(); });
    function renderMute() {
      const muted = audio.muted || audio.volume === 0;
      $('muteMusic').setAttribute('aria-pressed', String(muted));
      $('muteMusic').setAttribute('aria-label', muted ? '取消静音' : '静音');
      $('muteMusic').title = muted ? '取消静音' : '静音';
    }
    $('muteMusic').addEventListener('click', () => {
      if (audio.muted || audio.volume === 0) { audio.muted = false; if (audio.volume === 0) audio.volume = 0.55; }
      else audio.muted = true;
    });
    audio.addEventListener('volumechange', renderMute);
    audio.volume = 0.55;
    renderProgress();
    renderBuffered();
    renderMute();
    setPlayerState(audio.error ? 'error' : 'idle');
    $('musicControls').hidden = false;
    audio.controls = false;
    audio.hidden = true;
    // Browsers may buffer ahead; playback still requires a tap or click.
    if (!navigator.connection || !navigator.connection.saveData) audio.preload = 'auto';

    const letter = $('letter');
    function closeLetter() {
      if (typeof letter.close === 'function') letter.close(); else letter.removeAttribute('open');
      document.body.classList.remove('modal-open');
      $('openLetter').focus({preventScroll:true});
    }
    $('openLetter').addEventListener('click', () => {
      if (typeof letter.showModal === 'function') letter.showModal(); else letter.setAttribute('open','');
      document.body.classList.add('modal-open');
      letter.scrollTop = 0;
    });
    $('closeLetter').addEventListener('click', closeLetter);
    $('keepLetter').addEventListener('click', closeLetter);
    letter.addEventListener('click', event => {
      if (event.target !== letter) return;
      const r = letter.getBoundingClientRect();
      if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) closeLetter();
    });
    letter.addEventListener('close', () => document.body.classList.remove('modal-open'));
    letter.addEventListener('cancel', event => { event.preventDefault(); closeLetter(); });

    const fortunes = [
      '愿你想吃的，都不用排队。',
      '愿今天的快乐，比馅还满。',
      '愿好吃的，永远有下一家。',
      '愿今晚的烦恼，先放个假。',
      '愿你听的歌，刚好合心意。'
    ];
    let fortuneIndex = -1;
    function openFortune() {
      fortuneIndex = (fortuneIndex + 1) % fortunes.length;
      $('fortune').textContent = fortunes[fortuneIndex];
      $('fortuneLabel').textContent = '再拆一口';
      $('cakeButton').classList.remove('cake-pop');
      void $('cakeButton').offsetWidth;
      $('cakeButton').classList.add('cake-pop');
    }
    $('cakeButton').addEventListener('click', openFortune);
    $('fortuneButton').addEventListener('click', openFortune);
  })();
  </script>
